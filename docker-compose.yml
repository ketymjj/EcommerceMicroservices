services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # Porta do broker
      - "15672:15672"    # Porta do painel de gerenciamento
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  apigateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "5000:80"
    networks:
      - ecommerce-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      saleservice:
        condition: service_started
      stockservice:
        condition: service_started

  saleservice:
    build:
      context: ./SalesService
      dockerfile: Dockerfile
    container_name: saleservice
    ports:
      - "5001:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SalesDB;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
      - RabbitMQ__HostName=rabbitmq
    networks:
      - ecommerce-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  stockservice:
    build:
      context: ./StockService
      dockerfile: Dockerfile
    container_name: stockservice
    ports:
      - "5002:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=StockDB;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
      - RabbitMQ__HostName=rabbitmq
    networks:
      - ecommerce-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

volumes:
  rabbitmq-data:
  sqlserver-data:

networks:
  ecommerce-network:
    driver: bridge
